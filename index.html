<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>양수길 — 현장의 반복을 자동화합니다</title>
<meta name="description" content="이차전지 자동화 장비 제조사 경영지원팀. 현장에서 반복되던 업무를 직접 자동화해 사내 시스템 16개를 구축·운영 중입니다.">
<meta name="author" content="양수길">
<meta property="og:type" content="website">
<meta property="og:title" content="양수길 — 현장의 반복을 자동화합니다">
<meta property="og:description" content="사내 업무 자동화 시스템 16개 구축·운영. 연간 약 1,160시간 절감.">
<meta property="og:image" content="assets/bg/hero.jpg">
<meta name="theme-color" content="#F5F8FD">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232C6BFF'/><path d='M9 21l5-10 4 7 2-3 3 6z' fill='white'/></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   디자인 토큰 — 색과 여백을 여기서 한 번에 바꿉니다.
   ============================================================ */
:root{
  --bg:#F5F8FD; --bg-2:#EAF1FB; --surface:#FFFFFF; --surface-2:#F4F8FE;
  --line:#E2EAF7; --line-2:#CBD9EF;
  --text:#0A1020; --text-2:#3B4A63; --muted:#71829D;
  --blue:#2C6BFF; --violet:#7A3BF2; --mint:#00B884; --coral:#FF7A45;
  --grad:linear-gradient(115deg,#2C6BFF 0%,#7A3BF2 46%,#00B884 100%);
  --grad-soft:linear-gradient(115deg,rgba(44,107,255,.12),rgba(122,59,242,.12) 46%,rgba(0,184,132,.12));
  --r-lg:24px; --r-md:16px; --r-sm:10px;
  --pad:clamp(20px,5vw,64px);
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  --sh-1:0 1px 2px rgba(16,32,64,.05), 0 10px 28px -16px rgba(16,32,64,.28);
  --sh-2:0 30px 70px -34px rgba(28,56,110,.42);
  --sh-glow:0 34px 80px -38px rgba(44,107,255,.62);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:16px; line-height:1.7; letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  word-break:keep-all; overflow-wrap:break-word;
}
img{max-width:100%; display:block}
a{color:inherit}
::selection{background:rgba(44,107,255,.18)}
.wrap{width:min(1180px,100%); margin-inline:auto; padding-inline:var(--pad); position:relative; z-index:2}

/* ---------- 배경: 오로라 + 화면 벽 영상 ---------- */
.bgmedia{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:var(--bg) url("assets/bg/hero.jpg") center/cover no-repeat}
.bgmedia video{position:absolute; inset:0; z-index:1; width:100%; height:100%;
  object-fit:cover; opacity:0; transition:opacity 1.4s ease}
.bgmedia video.on{opacity:1}
.bgmedia::after{content:""; position:absolute; inset:0; z-index:2;
  background:linear-gradient(180deg,rgba(245,248,253,.74) 0%,rgba(245,248,253,.88) 40%,rgba(245,248,253,.97) 100%)}
.aurora{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; filter:blur(70px)}
.aurora i{position:absolute; display:block; border-radius:50%; opacity:.55;
  animation:drift 26s ease-in-out infinite}
.aurora i:nth-child(1){width:46vw; height:46vw; top:-14%; right:-6%;
  background:radial-gradient(circle,rgba(44,107,255,.55),transparent 68%)}
.aurora i:nth-child(2){width:38vw; height:38vw; top:22%; left:-10%; animation-delay:-9s;
  background:radial-gradient(circle,rgba(122,59,242,.42),transparent 68%)}
.aurora i:nth-child(3){width:34vw; height:34vw; bottom:-8%; right:18%; animation-delay:-17s;
  background:radial-gradient(circle,rgba(0,184,132,.38),transparent 68%)}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(4%,-5%,0) scale(1.12)}
  66%{transform:translate3d(-5%,4%,0) scale(.94)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
#bgfx{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.5;
  -webkit-mask-image:radial-gradient(130% 95% at 50% 20%,#000 28%,transparent 74%);
  mask-image:radial-gradient(130% 95% at 50% 20%,#000 28%,transparent 74%)}

/* ---------- 스크롤 진행 · 섹션 인디케이터 ---------- */
#progress{position:fixed; top:0; left:0; height:3px; width:0; background:var(--grad); z-index:99}
.dots{position:fixed; right:22px; top:50%; transform:translateY(-50%); z-index:70;
  display:flex; flex-direction:column; gap:14px}
.dots button{width:9px; height:9px; padding:0; border-radius:50%; cursor:pointer;
  border:1.5px solid var(--line-2); background:transparent; transition:.3s; position:relative}
.dots button::after{content:attr(data-t); position:absolute; right:20px; top:50%; transform:translateY(-50%) translateX(6px);
  font-size:11.5px; font-weight:600; white-space:nowrap; color:var(--text-2);
  background:var(--surface); border:1px solid var(--line); padding:4px 10px; border-radius:100px;
  box-shadow:var(--sh-1); opacity:0; pointer-events:none; transition:.28s}
.dots button:hover::after{opacity:1; transform:translateY(-50%) translateX(0)}
.dots button.on{background:var(--blue); border-color:var(--blue); transform:scale(1.35)}
@media (max-width:1180px){.dots{display:none}}

/* ---------- 커서 글로우 (데스크톱) ---------- */
.cursor{position:fixed; z-index:98; width:340px; height:340px; border-radius:50%; pointer-events:none;
  left:0; top:0; margin:-170px 0 0 -170px; opacity:0; transition:opacity .5s;
  background:radial-gradient(circle,rgba(44,107,255,.13),transparent 62%); filter:blur(12px)}
@media (hover:none),(max-width:900px){.cursor{display:none}}

/* ---------- 헤더 ---------- */
header{position:sticky; top:0; z-index:80; transition:.32s;
  background:rgba(245,248,253,.72); backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid transparent}
header.stuck{border-bottom-color:var(--line); box-shadow:0 6px 24px -18px rgba(16,32,64,.5)}
.nav{display:flex; align-items:center; gap:20px; height:68px}
.brand{font-weight:800; letter-spacing:-.035em; font-size:18px; margin-right:auto;
  display:flex; align-items:center; gap:10px}
.brand i{width:26px; height:26px; border-radius:9px; background:var(--grad); font-style:normal;
  display:grid; place-items:center; color:#fff; font-size:12px; font-weight:800;
  box-shadow:0 8px 18px -8px rgba(44,107,255,.8)}
.nav a{font-size:14px; color:var(--muted); text-decoration:none; transition:color .2s; position:relative}
.nav a:hover,.nav a.on{color:var(--text)}
.nav a b{font-family:var(--mono); font-size:11px; color:var(--blue); margin-right:5px; font-weight:700}
@media (max-width:940px){.nav a{display:none}}

/* ---------- 공통 ---------- */
section{padding:clamp(78px,10vw,148px) 0; position:relative; z-index:2}
.chapter{display:flex; align-items:center; gap:14px; margin-bottom:22px}
.chapter span{font-family:var(--mono); font-size:12px; letter-spacing:.2em; font-weight:700;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.chapter hr{flex:1; border:0; height:1px; background:linear-gradient(90deg,var(--line-2),transparent)}
h2{font-size:clamp(28px,4.6vw,50px); line-height:1.24; letter-spacing:-.04em; margin:0 0 18px; font-weight:800}
.lede{color:var(--text-2); font-size:clamp(15px,1.6vw,18px); max-width:64ch; margin:0 0 48px; line-height:1.85}
.lede em{font-style:normal; color:var(--text); font-weight:700;
  background:linear-gradient(transparent 62%, rgba(44,107,255,.22) 0)}

/* ---------- 섹션 영상 밴드 (전면 폭) ---------- */
.band{position:relative; width:100vw; margin-left:calc(50% - 50vw); margin-bottom:clamp(56px,7vw,96px);
  height:clamp(300px,44vw,520px); overflow:hidden; background:var(--surface-2);
  display:flex; align-items:center}
.band video,.band .poster{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.band video{opacity:0; transition:opacity 1.1s ease; z-index:1}
.band video.on{opacity:1}
.band .poster{z-index:0}
.band::after{content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(100deg, rgba(245,248,253,.96) 0%, rgba(245,248,253,.82) 34%,
             rgba(245,248,253,.34) 62%, rgba(245,248,253,.62) 100%)}
.band-in{position:relative; z-index:3; width:min(1180px,100%); margin-inline:auto; padding-inline:var(--pad)}
.band-k{display:inline-block; font-family:var(--mono); font-size:12px; letter-spacing:.2em; font-weight:700;
  margin-bottom:16px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.band h3{font-size:clamp(30px,5.6vw,68px); line-height:1.1; letter-spacing:-.05em; font-weight:800;
  margin:0 0 16px; max-width:16ch}
.band p{font-size:clamp(14px,1.6vw,18px); color:var(--text-2); margin:0; max-width:44ch; font-weight:600}

/* ---------- 키네틱 타이포 : 단어가 마스크에서 올라옵니다 ---------- */
.w{display:inline-block; overflow:hidden; vertical-align:top; padding-bottom:.06em; margin-bottom:-.06em}
.w > i{display:inline-block; font-style:inherit; font-weight:inherit;
  transform:translateY(115%); opacity:0;
  transition:transform .95s cubic-bezier(.16,.84,.34,1) var(--d,0ms), opacity .7s ease var(--d,0ms)}
.in .w > i{transform:none; opacity:1}
@media (prefers-reduced-motion:reduce){.w > i{transform:none; opacity:1; transition:none}}

/* ---------- 설명 글: 색 띠가 훑고 지나가며 나타납니다 ---------- */
.wipe{position:relative}
.wipe > *,.wipe{--wd:0ms}
.wipe.tx{opacity:0}
.wipe.tx.in,.in .wipe.tx{animation:wipeText 1.1s cubic-bezier(.76,0,.24,1) var(--wd) forwards}
.wipe::after{content:""; position:absolute; inset:-2px -4px; background:var(--grad); z-index:2;
  transform:scaleX(0); transform-origin:left center; pointer-events:none; border-radius:4px}
.wipe.in::after,.in .wipe::after{animation:wipeBar 1.1s cubic-bezier(.76,0,.24,1) var(--wd) forwards}
@keyframes wipeBar{0%{transform:scaleX(0); transform-origin:left center}
  46%{transform:scaleX(1); transform-origin:left center}
  47%{transform:scaleX(1); transform-origin:right center}
  100%{transform:scaleX(0); transform-origin:right center}}
@keyframes wipeText{0%,46%{opacity:0}47%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .wipe.tx{opacity:1} .wipe.tx.in,.in .wipe.tx,.wipe.in::after,.in .wipe::after{animation:none}
  .wipe::after{display:none}}

/* 등장 효과 */
.reveal{opacity:0; transform:translateY(30px) scale(.985); filter:blur(6px);
  transition:opacity .85s cubic-bezier(.16,.84,.34,1), transform .85s cubic-bezier(.16,.84,.34,1), filter .85s ease}
.reveal.in{opacity:1; transform:none; filter:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1; transform:none; filter:none; transition:none}}

/* ---------- 프롤로그 ---------- */
.hero{padding-top:clamp(48px,7vw,88px); padding-bottom:clamp(64px,9vw,120px); overflow:hidden}
.hero .wrap{will-change:transform}
.eyebrow{display:inline-flex; align-items:center; gap:10px; font-size:13px; font-weight:600;
  color:var(--text-2); border:1px solid var(--line); background:rgba(255,255,255,.72);
  backdrop-filter:blur(8px); padding:9px 18px; border-radius:100px; margin-bottom:28px;
  box-shadow:var(--sh-1)}
.eyebrow i{width:7px; height:7px; border-radius:50%; background:var(--mint); font-style:normal;
  box-shadow:0 0 0 4px rgba(0,184,132,.18); animation:blip 2.4s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.3}}
h1{font-size:clamp(36px,7.2vw,78px); line-height:1.12; letter-spacing:-.052em; font-weight:800; margin:0 0 26px}
h1 .hl{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  background-size:200% 100%; animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
h1 .thin{display:block; color:var(--text-2); font-weight:600; font-size:.40em;
  letter-spacing:-.03em; margin-top:22px; line-height:1.6}
.hero-sub{color:var(--text-2); max-width:58ch; font-size:clamp(15px,1.7vw,18px); line-height:1.9; margin:0 0 44px}
.who{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:56px}
.who span{font-size:13px; font-weight:600; color:var(--text-2); background:var(--surface);
  border:1px solid var(--line); padding:8px 15px; border-radius:100px; box-shadow:var(--sh-1);
  transition:transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s}
.who span:hover{transform:translateY(-3px); box-shadow:var(--sh-glow)}

/* 히어로 숫자 */
.figures{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
.fig{background:rgba(255,255,255,.82); backdrop-filter:blur(14px); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:28px 24px 24px; position:relative; overflow:hidden;
  box-shadow:var(--sh-1); transition:transform .4s cubic-bezier(.2,.8,.3,1), box-shadow .4s}
.fig:hover{transform:translateY(-6px); box-shadow:var(--sh-glow)}
.fig::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad)}
.fig::after{content:""; position:absolute; inset:0; opacity:0; transition:opacity .4s;
  background:radial-gradient(120% 90% at 50% 0%, rgba(44,107,255,.10), transparent 62%)}
.fig:hover::after{opacity:1}
.fig .n{font-size:clamp(30px,3.8vw,44px); font-weight:800; letter-spacing:-.05em; line-height:1.06;
  display:flex; align-items:baseline; gap:4px; position:relative}
.fig .n small{font-size:.40em; font-weight:700; color:var(--muted); letter-spacing:-.02em}
.fig .k{font-size:13px; color:var(--muted); margin-top:11px; line-height:1.5; position:relative}
.fig.g1 .n{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.fig.g2 .n{color:var(--mint)}
@media (max-width:860px){.figures{grid-template-columns:repeat(2,1fr)}}

.scroll-cue{display:inline-flex; align-items:center; gap:12px; margin-top:44px; color:var(--muted);
  font-size:13px; font-weight:600; text-decoration:none; letter-spacing:.02em}
.scroll-cue .bar{width:38px; height:2px; border-radius:2px; background:var(--line-2); position:relative; overflow:hidden}
.scroll-cue .bar::after{content:""; position:absolute; inset:0; background:var(--grad); animation:slide 2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.scroll-cue:hover{color:var(--text)}

/* ---------- Ch.01 문제 ---------- */
.problems{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
@media (max-width:900px){.problems{grid-template-columns:1fr}}
.problem{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:32px 30px 26px; box-shadow:var(--sh-1); position:relative; overflow:hidden;
  transition:transform .4s cubic-bezier(.2,.8,.3,1), box-shadow .4s}
.problem:hover{transform:translateY(-6px); box-shadow:var(--sh-2)}
.problem .q{font-family:var(--mono); font-size:11.5px; color:var(--coral); letter-spacing:.16em;
  font-weight:700; margin-bottom:18px}
.problem h3{font-size:20px; margin:0 0 13px; letter-spacing:-.035em; font-weight:700; line-height:1.45}
.problem p{color:var(--text-2); font-size:14.8px; margin:0 0 22px; line-height:1.8}
.before{display:flex; align-items:center; gap:10px; border-top:1px dashed var(--line-2); padding-top:18px;
  font-size:13px; color:var(--muted); font-weight:600}
.before b{margin-left:auto; color:var(--coral); font-size:16px; font-weight:800; letter-spacing:-.02em}

/* ---------- Ch.02 타임라인 ---------- */
.timeline{position:relative; padding-left:38px}
.tl-track{position:absolute; left:6px; top:10px; bottom:10px; width:2px; background:var(--line); border-radius:2px}
.tl-fill{position:absolute; left:0; top:0; width:100%; height:0; background:var(--grad); border-radius:2px;
  transition:height .18s linear}
.step{position:relative; padding:0 0 48px}
.step:last-child{padding-bottom:0}
.step::before{content:""; position:absolute; left:-38px; top:8px; width:14px; height:14px; border-radius:50%;
  background:var(--surface); border:2px solid var(--line-2); transition:.45s; z-index:1}
.step.lit::before{border-color:var(--blue); background:var(--blue); box-shadow:0 0 0 6px rgba(44,107,255,.16)}
.step .yr{font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--muted);
  font-weight:700; margin-bottom:8px; transition:color .4s}
.step.lit .yr{color:var(--blue)}
.step h3{font-size:clamp(19px,2.4vw,24px); margin:0 0 10px; letter-spacing:-.035em; font-weight:700}
.step p{color:var(--text-2); font-size:15px; margin:0; max-width:66ch; line-height:1.85}

/* ---------- Ch.03 프로젝트 ---------- */
.filters{position:relative; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:34px}
.filters button{font:inherit; font-size:13.5px; font-weight:700; color:var(--text-2); cursor:pointer;
  background:var(--surface); border:1px solid var(--line); padding:10px 19px; border-radius:100px;
  transition:.25s cubic-bezier(.2,.8,.3,1); display:inline-flex; align-items:center; gap:9px;
  box-shadow:var(--sh-1)}
.filters button:hover{transform:translateY(-2px); border-color:var(--line-2)}
.filters button[aria-pressed="true"]{background:var(--grad); border-color:transparent; color:#fff;
  box-shadow:var(--sh-glow)}
.filters button em{font-style:normal; font-family:var(--mono); font-size:11px; opacity:.65}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
@media (max-width:1020px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:660px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--sh-1); position:relative;
  transform-style:preserve-3d; will-change:transform;
  transition:box-shadow .45s, border-color .45s, transform .5s cubic-bezier(.2,.8,.3,1)}
.card:hover{box-shadow:var(--sh-2); border-color:var(--line-2)}
.card.hide{display:none}
.card .spot{position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0; transition:opacity .4s;
  background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%), rgba(44,107,255,.12), transparent 60%)}
.card:hover .spot{opacity:1}
.shot{aspect-ratio:16/10; background:var(--surface-2); position:relative; overflow:hidden;
  border-bottom:1px solid var(--line)}
.shot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center;
  transition:transform .7s cubic-bezier(.2,.8,.3,1)}
.card:hover .shot img{transform:scale(1.06)}
.shot .ph{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:8px; color:var(--muted); font-size:11.5px; font-family:var(--mono);
  background-image:linear-gradient(rgba(10,16,32,.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(10,16,32,.04) 1px,transparent 1px);
  background-size:22px 22px}
.lock{position:absolute; top:13px; right:13px; z-index:2; font-size:11.5px; font-weight:700;
  background:rgba(255,255,255,.92); border:1px solid var(--line); color:var(--text-2);
  padding:6px 12px; border-radius:100px; backdrop-filter:blur(8px); box-shadow:var(--sh-1)}
.lock.soon{background:var(--grad); border-color:transparent; color:#fff}
.repro{position:absolute; left:13px; bottom:13px; z-index:2; font-size:11px; font-weight:600;
  background:rgba(255,255,255,.88); border:1px solid var(--line); color:var(--muted);
  padding:5px 10px; border-radius:7px; backdrop-filter:blur(8px)}
.card-body{padding:26px 24px 28px; display:flex; flex-direction:column; flex:1; position:relative; z-index:2}
.cat{font-size:11.5px; font-weight:700; letter-spacing:.04em; margin-bottom:12px;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.card h3{font-size:18.5px; margin:0 0 11px; letter-spacing:-.035em; font-weight:700; line-height:1.45}

<!-- ============================================================
     아래는 화면을 그리고 움직이는 코드입니다. 내용 수정은 위쪽 상수에서만 하시면 됩니다.

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const nf  = n => n.toLocaleString('ko-KR');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 자동 집계 : 'live' 상태인 프로젝트만 합산 ---------- */
  const live       = projects.filter(p => p.status === 'live');
  const sysCount   = live.length;
  const totalHours = live.reduce((s,p) => s + (p.hours || 0), 0);
  const totalEst   = live.reduce((s,p) => s + (p.est   || 0), 0);
  const estEok     = (totalEst / 10000).toFixed(1);
  const fte        = (totalHours / 2000).toFixed(1);

  /* ---------- 프롤로그 ---------- */
  $('roleLine').textContent = PROFILE.eyebrow;
  $('heroTitle').innerHTML  = PROFILE.title + '<span class="thin">' + PROFILE.titleSub + '</span>';
  $('heroSub').textContent  = PROFILE.sub;
  $('whoTags').innerHTML    = PROFILE.tags.map(t => '<span>' + esc(t) + '</span>').join('');

  const FIGURES = [
    { n: sysCount,   d: 0, u: '개',    k: '사내에서 운영 중인 시스템', c: 'g1' },
    { n: totalHours, d: 0, u: '시간',  k: '연간 절감 업무시간 (추정)', c: 'g1' },
    { n: +estEok,    d: 1, u: '억 원', k: '외주 구축 시 환산 비용 (추정)', c: 'g1' },
    { n: 0,          d: 0, u: '원',    k: '실제 구축 · 운영 지출', c: 'g2' },
  ];
  $('figures').innerHTML = FIGURES.map((f,i) =>
    '<div class="fig ' + f.c + '" style="transition-delay:' + i*60 + 'ms">' +
      '<div class="n"><span data-count="' + f.n + '" data-dec="' + f.d + '">0</span><small>' + f.u + '</small></div>' +
      '<div class="k">' + esc(f.k) + '</div></div>').join('');

  /* ---------- 섹션 문구 ---------- */
  const T = TEXT;
  [['p1',T.ch1Title,T.ch1Lede],['p2',T.ch2Title,T.ch2Lede],['p3',T.ch3Title,T.ch3Lede],
   ['p4',T.ch4Title,T.ch4Lede],['p5',T.ch5Title,T.ch5Lede],['p6',T.ch6Title,T.ch6Lede],
   ['p7',T.ch7Title,T.ch7Lede]].forEach(([k,t,l]) => {
    $(k+'Title').textContent = t; $(k+'Lede').innerHTML = l;
  });
  $('disclaimer').textContent = T.disclaimer;
  $('yr').textContent = new Date().getFullYear();

  /* ---------- Ch.01 문제 ---------- */
  $('problems').innerHTML = PROBLEMS.map((p,i) =>
    '<div class="problem reveal" style="transition-delay:' + i*90 + 'ms">' +
      '<div class="q">' + esc(p.q) + '</div><h3>' + esc(p.h) + '</h3><p>' + esc(p.p) + '</p>' +
      '<div class="before">' + esc(p.label) + '<b>' + esc(p.v) + '</b></div></div>').join('');

  /* ---------- Ch.02 타임라인 ---------- */
  $('timeline').insertAdjacentHTML('beforeend', TIMELINE.map(s =>
    '<div class="step reveal"><div class="yr">' + esc(s.yr) + '</div>' +
    '<h3>' + esc(s.h) + '</h3><p>' + esc(s.p) + '</p></div>').join(''));

  /* ---------- Ch.03 프로젝트 ---------- */
  const PH = '<div class="ph">SCREENSHOT</div>';
  const BADGE = { live: '🔒 사내 운영 중 (비공개)', soon: '🚀 도입 예정' };
  $('grid').innerHTML = projects.map((p, i) =>
    '<article class="card reveal" data-cat="' + p.cat + '" style="transition-delay:' + (i % 3) * 80 + 'ms">' +
      '<span class="spot"></span>' +
      '<div class="shot">' + PH +
        '<img src="' + esc(p.img) + '" alt="' + esc(p.title) + ' 화면" loading="lazy">' +
        '<span class="lock' + (p.status === 'soon' ? ' soon' : '') + '">' + BADGE[p.status] + '</span>' +
        (REPRO_BADGE ? '<span class="repro">재현 화면</span>' : '') +
      '</div>' +
      '<div class="card-body">' +
        '<div class="cat">' + esc((CATEGORIES.find(c => c.key === p.cat) || {}).label || '') + '</div>' +
        '<h3>' + esc(p.title) + '</h3>' +
        '<p class="desc">' + esc(p.desc) + '</p>' +
        (p.impact ? '<div class="impact"><div class="lb">IMPACT</div><p>' + esc(p.impact) + '</p></div>' : '') +
        '<div class="tags">' + p.stack.map(s => '<span>' + esc(s) + '</span>').join('') + '</div>' +
      '</div></article>').join('');

  $('filters').innerHTML = CATEGORIES.map((c, i) => {
    const n = c.key === 'all' ? projects.length : projects.filter(p => p.cat === c.key).length;
    return '<button data-f="' + c.key + '" aria-pressed="' + (i === 0) + '">' + esc(c.label) + '<em>' + n + '</em></button>';
  }).join('');
  $('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('filters').children].forEach(x => x.setAttribute('aria-pressed', x === b));
    const f = b.dataset.f;
    [...$('grid').children].forEach((card, i) => {
      const show = f === 'all' || card.dataset.cat === f;
      card.classList.toggle('hide', !show);
      if (show && !reduce){ card.style.animation = 'none'; void card.offsetWidth;
        card.style.transitionDelay = (i % 3) * 60 + 'ms'; }
    });
  });

  /* 카드 3D 기울기 + 커서 스포트라이트 */
  if (!reduce && matchMedia('(hover:hover)').matches){
    $('grid').addEventListener('pointermove', e => {
      const card = e.target.closest('.card'); if (!card) return;
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      card.style.setProperty('--mx', px * 100 + '%');
      card.style.setProperty('--my', py * 100 + '%');
      card.style.transform = 'perspective(1000px) rotateY(' + (px - .5) * 6 + 'deg) rotateX(' +
                             (.5 - py) * 6 + 'deg) translateY(-6px)';
    });
    $('grid').addEventListener('pointerleave', () => {
      [...$('grid').children].forEach(c => { c.style.transform = ''; });
    }, true);
    $('grid').addEventListener('pointerout', e => {
      const card = e.target.closest('.card');
      if (card && !card.contains(e.relatedTarget)) card.style.transform = '';
    });
  }

  /* ---------- Ch.04 효과 ---------- */
  $('baList').innerHTML = BARS.map(b => {
    const pct = Math.max(4, Math.round(b.after / b.before * 100));
    const cut = Math.round((1 - b.after / b.before) * 100);
    return '<div class="ba"><div class="t">' + esc(b.t) + '</div>' +
      '<div class="row"><span class="lb">BEFORE</span><span class="track"><i class="fill before-f" data-w="100"></i></span>' +
      '<span class="v">' + nf(b.before) + b.unit + '</span></div>' +
      '<div class="row"><span class="lb">AFTER</span><span class="track"><i class="fill after-f" data-w="' + pct + '"></i></span>' +
      '<span class="v hi">' + nf(b.after) + b.unit + '</span></div>' +
      '<div class="cut">→ <b>' + cut + '%</b> 단축</div></div>';
  }).join('');

  $('kpis').innerHTML = [
    { n: totalHours, d: 0, u: '시간',  k: '연간 절감 업무시간', c: 'a' },
    { n: +fte,       d: 1, u: '명분',  k: '정규직 인력 환산 (연 2,000시간 기준)', c: 'a' },
    { n: +estEok,    d: 1, u: '억 원', k: '외주 환산 구축비 (운영 중 ' + sysCount + '개 합계)', c: 'a' },
    { n: 0,          d: 0, u: '원',    k: '실제 지출한 구축 · 운영 비용', c: 'b' },
  ].map(k => '<div class="kpi ' + k.c + '">' +
      '<div class="n"><span data-count="' + k.n + '" data-dec="' + k.d + '">0</span><small>' + k.u + '</small></div>' +
      '<div class="k">' + esc(k.k) + '</div></div>').join('');
  $('notes').innerHTML = NOTES.map(n => '<li>' + esc(n) + '</li>').join('');

  /* ---------- Ch.05 · 스택 · 에필로그 ---------- */
  $('ways').innerHTML = WAYS.map((w, i) =>
    '<div class="way reveal" style="transition-delay:' + i * 80 + 'ms"><div class="num">' + esc(w.n) + '</div>' +
    '<h3>' + esc(w.h) + '</h3><p>' + esc(w.p) + '</p></div>').join('');

  const allTools = STACK.flatMap(g => g.items);
  $('marquee').innerHTML = [...allTools, ...allTools].map(t => '<span>' + esc(t) + '</span>').join('');
  $('stackGrid').innerHTML = STACK.map((g,i) =>
    '<div class="sgroup reveal" style="transition-delay:' + i*70 + 'ms"><h3>' + esc(g.g) + '</h3><ul>' +
    g.items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('');

  $('recap').innerHTML = [
    ['운영 중인 시스템', nf(sysCount), '개'],
    ['연간 절감 업무시간', nf(totalHours), '시간'],
    ['외주 환산 구축비', estEok, '억 원'],
    ['실제 지출', '0', '원'],
  ].map(([k, v, u]) => '<span>' + esc(k) + '<b>' + v + '</b>' + esc(u) + '</span>').join('');
  $('sign').innerHTML = '<span><b>' + esc(T.signName) + '</b> · ' + esc(T.signRole) + '</span>' +
    '<span>마지막 업데이트 ' + new Date().getFullYear() + '</span>';

  /* CONTACT 에 값이 있는 항목만 표시됩니다. 전부 비어 있으면 블록이 나오지 않습니다. */
  $('contactList').innerHTML = CONTACT.filter(c => (c.value || '').trim()).map(c => {
    const v = c.value.trim();
    const body = c.link ? '<span class="val"><a href="' + esc(c.link) + '">' + esc(v) + '</a></span>'
                        : '<span class="val">' + esc(v) + '</span>';
    return '<div class="citem"><div class="lb">' + esc(c.lb) + '</div>' + body + '</div>';
  }).join('');
  if ($('contactList').innerHTML) $('contactList').style.marginTop = '34px';

  /* ---------- 섹션 영상 밴드 ---------- */
  document.querySelectorAll('.band').forEach(el => {
    const b = BANDS[el.dataset.band]; if (!b) return;
    el.innerHTML =
      '<img class="poster" src="assets/sec/' + el.dataset.band + '.jpg" alt="" loading="lazy">' +
      '<video muted loop playsinline preload="none" data-src="assets/sec/' + el.dataset.band + '.webm"></video>' +
      '<div class="band-in"><span class="band-k">' + esc(b.k) + '</span>' +
      '<h3 class="kin">' + esc(b.h) + '</h3>' +
      '<p class="wipe tx">' + esc(b.p) + '</p></div>';
  });
  /* 화면에 가까워질 때만 영상을 내려받습니다. */
  const vio = new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return;
    const v = en.target.querySelector('video');
    vio.unobserve(en.target);
    if (!v || reduce || innerWidth < 720) return;
    const c = navigator.connection || {};
    if (c.saveData === true || /(^|-)2g$/.test(c.effectiveType || '')) return;
    v.src = v.dataset.src;
    const pr = v.play();
    if (pr && pr.then) pr.then(() => v.classList.add('on')).catch(() => {});
    else v.classList.add('on');
  }), { rootMargin: '400px 0px' });
  document.querySelectorAll('.band').forEach(el => vio.observe(el));

  /* ---------- 키네틱 타이포: 제목을 단어 단위로 쪼갭니다 ---------- */
  function splitWords(el){
    if (!el || el.dataset.split) return;
    el.dataset.split = '1';
    let idx = 0;
    const walk = node => {
      [...node.childNodes].forEach(ch => {
        if (ch.nodeType === 3){
          const parts = ch.textContent.split(/(\s+)/);
          const frag = document.createDocumentFragment();
          parts.forEach(t => {
            if (!t) return;
            if (/^\s+$/.test(t)){ frag.appendChild(document.createTextNode(t)); return; }
            const w = document.createElement('span'); w.className = 'w';
            const i = document.createElement('i');
            i.style.setProperty('--d', (idx++ * 55) + 'ms');
            i.textContent = t; w.appendChild(i); frag.appendChild(w);
          });
          node.replaceChild(frag, ch);
        } else if (ch.nodeType === 1 && !ch.classList.contains('thin') && !ch.classList.contains('w')){
          walk(ch);
        }
      });
    };
    walk(el);
  }
  document.querySelectorAll('.kin').forEach(splitWords);
  /* 설명 글은 제목보다 살짝 늦게 훑고 지나갑니다. */
  document.querySelectorAll('.wipe').forEach(el => el.style.setProperty('--wd', '220ms'));

  /* ---------- 숫자 카운트업 ---------- */
  function countUp(el){
    const target = parseFloat(el.dataset.count), dec = +el.dataset.dec || 0;
    if (reduce || target === 0){ el.textContent = dec ? target.toFixed(dec) : nf(target); return; }
    const dur = 1500, t0 = performance.now();
    (function tick(now){
      const k = Math.min(1, (now - t0) / dur);
      const v = target * (1 - Math.pow(1 - k, 4));
      el.textContent = dec ? v.toFixed(dec) : nf(Math.round(v));
      if (k < 1) requestAnimationFrame(tick);
      else el.textContent = dec ? target.toFixed(dec) : nf(target);
    })(t0);
  }

  /* ---------- 등장 처리 ----------
     화면에 들어온 요소를 순서대로 켭니다. 빠르게 스크롤하거나 목차로 건너뛰어도
     지나친 요소가 그대로 숨겨지지 않도록, 스크롤할 때마다 남은 목록을 훑습니다. */
  let pending = [...document.querySelectorAll('.reveal')];
  function revealSweep(){
    if (!pending.length) return;
    const line = innerHeight * .9;
    pending = pending.filter(el => {
      if (el.getBoundingClientRect().top > line) return true;
      el.classList.add('in');
      el.querySelectorAll('[data-count]').forEach(countUp);
      el.querySelectorAll('.fill').forEach(f => { f.style.width = f.dataset.w + '%'; });
      return false;
    });
  }

  /* ---------- 섹션 인디케이터 ---------- */
  const SECTIONS = [['hero','프롤로그'],['ch01','01 문제'],['ch02','02 확산'],['ch03','03 실적'],
                    ['ch04','04 효과'],['ch05','05 일하는 방식'],['stack','도구'],['contact','마무리']];
  $('dots').innerHTML = SECTIONS.map(([id,t]) =>
    '<button data-go="' + id + '" data-t="' + esc(t) + '" aria-label="' + esc(t) + '"></button>').join('');
  $('dots').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $(b.dataset.go).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
  });

  /* ---------- 배경 영상 (조건이 맞을 때만) ---------- */
  (function bgVideo(){
    const v = $('bgvid'); if (!v) return;
    const c = navigator.connection || {};
    if (reduce || innerWidth < 900 || c.saveData === true || /(^|-)2g$/.test(c.effectiveType || '')) return;
    v.src = v.dataset.src;
    const play = v.play();
    if (play && play.then) play.then(() => v.classList.add('on')).catch(() => {});
    else v.classList.add('on');
  })();

  /* ---------- 커서 글로우 ---------- */
  if (!reduce && matchMedia('(hover:hover)').matches){
    const cur = $('cursor');
    addEventListener('pointermove', e => {
      cur.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
      cur.style.opacity = 1;
    }, { passive:true });
  }

  /* ---------- 스크롤 통합 처리 (진행바 · 패럴랙스 · 타임라인 · 인디케이터) ---------- */
  const bar = $('progress'), head = document.querySelector('header'), heroInner = $('heroInner');
  const tl = $('timeline'), tlFill = $('tlFill'), steps = () => [...tl.querySelectorAll('.step')];
  const bgm = document.querySelector('.bgmedia');
  const navLinks = [...document.querySelectorAll('.nav a')];
  let ticking = false;

  function onScroll(){
    const y = scrollY, vh = innerHeight;
    const max = document.documentElement.scrollHeight - vh;
    bar.style.width = (max > 0 ? y / max * 100 : 0) + '%';
    head.classList.toggle('stuck', y > 12);

    /* 히어로 패럴랙스 — 스크롤에 따라 살짝 밀리며 옅어집니다. */
    if (!reduce && y < vh){
      const k = y / vh;
      heroInner.style.transform = 'translate3d(0,' + (k * 72) + 'px,0) scale(' + (1 - k * .05) + ')';
      heroInner.style.opacity = String(Math.max(0, 1 - k * 1.15));
    }
    /* 배경도 아주 천천히 따라 움직입니다. */
    if (!reduce && bgm) bgm.style.transform = 'translate3d(0,' + (y * .06) + 'px,0) scale(1.06)';

    /* 타임라인 진행선 */
    const r = tl.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (vh * .72 - r.top) / r.height));
    tlFill.style.height = (p * 100) + '%';
    const lit = r.top + r.height * p;
    steps().forEach(s => {
      const sr = s.getBoundingClientRect();
      s.classList.toggle('lit', sr.top + 12 <= lit);
    });

    /* 현재 섹션 표시 */
    let cur = SECTIONS[0][0];
    for (const [id] of SECTIONS){
      const el = $(id); if (!el) continue;
      if (el.getBoundingClientRect().top <= vh * .35) cur = id;
    }
    [...$('dots').children].forEach(b => b.classList.toggle('on', b.dataset.go === cur));
    navLinks.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));
    revealSweep();
    ticking = false;
  }
  addEventListener('scroll', () => {
    if (!ticking){ ticking = true; requestAnimationFrame(onScroll); }
  }, { passive:true });
  addEventListener('resize', onScroll, { passive:true });
  onScroll();

  /* ---------- 배경 : 자동화 데이터 흐름 ---------- */
  (function background(){
    const cv = $('bgfx'); if (!cv) return;
    const ctx = cv.getContext('2d');
    const BL = '44,107,255', VI = '122,59,242', MI = '0,184,132';
    const HUES = [BL, VI, MI];
    let W = 0, H = 0, DPR = 1, N = [], L = [], P = [], raf = 0;

    function build(){
      const n = innerWidth < 720 ? 20 : innerWidth < 1100 ? 34 : 48;
      N = Array.from({ length: n }, (_, i) => ({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .13 * DPR, vy: (Math.random() - .5) * .13 * DPR,
        r: (Math.random() * 1.6 + 1.2) * DPR, c: HUES[i % 3],
      }));
      P = [];
    }
    function resize(){
      DPR = Math.min(2, devicePixelRatio || 1);
      W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
      cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
      build();
    }
    function frame(){
      ctx.clearRect(0, 0, W, H); L.length = 0;
      for (const a of N){
        a.x += a.vx; a.y += a.vy;
        if (a.x < 0 || a.x > W) a.vx *= -1;
        if (a.y < 0 || a.y > H) a.vy *= -1;
      }
      const d = (innerWidth < 720 ? 130 : 175) * DPR;
      ctx.lineWidth = DPR * .7;
      for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++){
        const a = N[i], b = N[j], dist = Math.hypot(a.x - b.x, a.y - b.y);
        if (dist >= d) continue;
        ctx.strokeStyle = 'rgba(' + a.c + ',' + (1 - dist / d) * .22 + ')';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        L.push([a, b]);
      }
      if (L.length && P.length < 8 && Math.random() < .06)
        P.push({ l: L[(Math.random() * L.length) | 0], t: 0, c: HUES[(Math.random() * 3) | 0] });
      for (let k = P.length - 1; k >= 0; k--){
        const p = P[k]; p.t += .013;
        if (p.t >= 1){ P.splice(k, 1); continue; }
        const a = p.l[0], b = p.l[1];
        const x = a.x + (b.x - a.x) * p.t, y = a.y + (b.y - a.y) * p.t, rr = 9 * DPR;
        const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
        g.addColorStop(0, 'rgba(' + p.c + ',.85)'); g.addColorStop(1, 'rgba(' + p.c + ',0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.2832); ctx.fill();
      }
      for (const a of N){
        ctx.fillStyle = 'rgba(' + a.c + ',.42)';
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.2832); ctx.fill();
      }
      if (!reduce) raf = requestAnimationFrame(frame);
    }
    resize();
    addEventListener('resize', () => { cancelAnimationFrame(raf); resize(); if (!reduce) raf = requestAnimationFrame(frame); });
    frame();
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(raf);
      if (!document.hidden && !reduce) raf = requestAnimationFrame(frame);
    });
  })();
})();
</script>
</body>
</html>
