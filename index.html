<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>양수길 — 현장의 반복을 자동화합니다</title>
<meta name="description" content="이차전지 자동화 장비 제조사 경영지원팀. 현장에서 반복되던 업무를 직접 자동화해 사내 시스템 16개를 구축·운영 중입니다.">
<meta name="author" content="양수길">
<meta property="og:type" content="website">
<meta property="og:title" content="양수길 — 현장의 반복을 자동화합니다">
<meta property="og:description" content="사내 업무 자동화 시스템 16개 구축·운영. 연간 약 1,600시간 절감.">
<meta property="og:image" content="assets/og-image.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230E1114'/><path d='M9 20l5-9 4 6 2-3 3 6z' fill='%23F0B429'/></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   디자인 토큰 — 색/여백/모서리를 한 곳에서 바꿉니다.
   ============================================================ */
:root{
  --bg:#0E1114; --bg-soft:#12161B; --surface:#171C22; --surface-2:#1D242C;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
  --text:#E8EDF2; --text-mid:#B4C0CC; --muted:#7E8B99;
  --amber:#F0B429; --amber-soft:rgba(240,180,41,.14);
  --mint:#3DDC97; --mint-soft:rgba(61,220,151,.13);
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --pad:clamp(20px,5vw,64px);
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 18px 50px -24px rgba(0,0,0,.85);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:16px; line-height:1.7; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
img{max-width:100%; display:block}
a{color:inherit}
::selection{background:var(--amber); color:#0E1114}

/* 은은한 배경 광원 — 딱딱함을 덜어주는 요소 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(60vw 50vh at 78% -8%, rgba(240,180,41,.10), transparent 62%),
    radial-gradient(52vw 46vh at 6% 22%, rgba(61,220,151,.07), transparent 60%);
}
.wrap{width:min(1140px,100%); margin-inline:auto; padding-inline:var(--pad); position:relative; z-index:1}

/* 스크롤 진행 바 */
#progress{position:fixed; top:0; left:0; height:2px; width:0;
  background:linear-gradient(90deg,var(--amber),var(--mint)); z-index:99; transition:width .1s linear}

/* ---------- 상단 내비게이션 ---------- */
header{position:sticky; top:0; z-index:60; backdrop-filter:blur(14px);
  background:rgba(14,17,20,.72); border-bottom:1px solid transparent; transition:border-color .3s}
header.stuck{border-bottom-color:var(--line)}
.nav{display:flex; align-items:center; gap:18px; height:64px}
.brand{font-weight:800; letter-spacing:-.03em; font-size:17px; margin-right:auto; display:flex; align-items:center; gap:9px}
.brand i{width:9px; height:9px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px var(--mint-soft); font-style:normal}
.nav a{font-size:14px; color:var(--muted); text-decoration:none; transition:color .2s}
.nav a:hover{color:var(--text)}
.nav a b{font-family:var(--mono); font-size:11px; color:var(--amber); opacity:.7; margin-right:5px; font-weight:600}
@media (max-width:860px){.nav a{display:none}}

/* ---------- 공통 섹션 ---------- */
section{padding:clamp(72px,10vw,132px) 0; position:relative; z-index:1}
.chapter{display:flex; align-items:center; gap:14px; margin-bottom:20px}
.chapter span{font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:var(--amber); font-weight:600}
.chapter hr{flex:1; border:0; height:1px; background:linear-gradient(90deg,var(--line-strong),transparent)}
h2{font-size:clamp(27px,4.2vw,42px); line-height:1.28; letter-spacing:-.035em; margin:0 0 16px; font-weight:800}
.lede{color:var(--text-mid); font-size:clamp(15px,1.6vw,17.5px); max-width:62ch; margin:0 0 44px; line-height:1.85}
.lede em{font-style:normal; color:var(--text); border-bottom:1.5px solid var(--amber-soft); box-shadow:inset 0 -8px 0 var(--amber-soft)}

/* 스크롤 등장 효과 */
.reveal{opacity:0; transform:translateY(22px); transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1; transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1; transform:none; transition:none}}

/* ---------- 프롤로그(히어로) ---------- */
.hero{padding-top:clamp(56px,9vw,104px); padding-bottom:clamp(56px,8vw,96px)}
.eyebrow{display:inline-flex; align-items:center; gap:9px; font-size:12.5px; font-family:var(--mono);
  letter-spacing:.06em; color:var(--text-mid); border:1px solid var(--line);
  background:rgba(255,255,255,.03); padding:7px 14px; border-radius:100px; margin-bottom:26px}
.eyebrow i{width:6px; height:6px; border-radius:50%; background:var(--mint); font-style:normal;
  animation:blip 2.4s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
h1{font-size:clamp(33px,6.6vw,68px); line-height:1.16; letter-spacing:-.045em; font-weight:800; margin:0 0 24px}
h1 .hl{color:var(--amber)}
h1 .thin{display:block; color:var(--text-mid); font-weight:600; font-size:.44em; letter-spacing:-.03em; margin-top:18px; line-height:1.6}
.hero-sub{color:var(--text-mid); max-width:58ch; font-size:clamp(15px,1.7vw,17.5px); line-height:1.9; margin:0 0 44px}
.who{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:52px}
.who span{font-size:13px; color:var(--text-mid); background:var(--surface); border:1px solid var(--line);
  padding:6px 13px; border-radius:100px}

/* 히어로 숫자 */
.figures{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.fig{background:var(--bg-soft); padding:26px 22px; position:relative}
.fig::after{content:""; position:absolute; left:22px; top:0; width:26px; height:2px; background:var(--amber); opacity:.75}
.fig:nth-child(4)::after{background:var(--mint)}
.fig .n{font-size:clamp(28px,3.6vw,40px); font-weight:800; letter-spacing:-.04em; line-height:1.1; display:flex; align-items:baseline; gap:3px}
.fig .n small{font-size:.42em; font-weight:700; color:var(--text-mid); letter-spacing:-.02em}
.fig .k{font-size:12.5px; color:var(--muted); margin-top:9px; line-height:1.5}
.fig.accent .n{color:var(--mint)}
@media (max-width:820px){.figures{grid-template-columns:repeat(2,1fr)}}

.scroll-cue{display:flex; align-items:center; gap:11px; margin-top:38px; color:var(--muted);
  font-size:12px; font-family:var(--mono); letter-spacing:.14em; text-decoration:none; width:fit-content}
.scroll-cue .bar{width:34px; height:1px; background:var(--line-strong); position:relative; overflow:hidden}
.scroll-cue .bar::after{content:""; position:absolute; inset:0; background:var(--amber); animation:slide 2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.scroll-cue:hover{color:var(--text)}

/* ---------- Ch.01 문제 ---------- */
.problems{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
@media (max-width:900px){.problems{grid-template-columns:1fr}}
.problem{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:28px 26px 24px}
.problem .q{font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.14em; margin-bottom:16px}
.problem h3{font-size:19px; margin:0 0 12px; letter-spacing:-.03em; font-weight:700; line-height:1.45}
.problem p{color:var(--text-mid); font-size:14.5px; margin:0 0 20px; line-height:1.8}
.before{display:flex; align-items:center; gap:10px; border-top:1px dashed var(--line-strong); padding-top:16px;
  font-size:13px; color:var(--muted)}
.before b{color:var(--amber); font-family:var(--mono); font-size:14px; font-weight:600}

/* ---------- Ch.02 타임라인 ---------- */
.timeline{position:relative; padding-left:30px}
.timeline::before{content:""; position:absolute; left:5px; top:8px; bottom:8px; width:1px;
  background:linear-gradient(180deg,var(--amber),var(--mint),transparent)}
.step{position:relative; padding:0 0 40px}
.step:last-child{padding-bottom:0}
.step::before{content:""; position:absolute; left:-30px; top:7px; width:11px; height:11px; border-radius:50%;
  background:var(--bg); border:2px solid var(--amber)}
.step:last-child::before{border-color:var(--mint)}
.step .yr{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--muted); margin-bottom:7px}
.step h3{font-size:clamp(18px,2.3vw,22px); margin:0 0 9px; letter-spacing:-.03em; font-weight:700}
.step p{color:var(--text-mid); font-size:14.8px; margin:0; max-width:64ch; line-height:1.82}

/* ---------- Ch.03 프로젝트 ---------- */
.filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:30px}
.filters button{font:inherit; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer;
  background:var(--surface); border:1px solid var(--line); padding:9px 17px; border-radius:100px;
  transition:.22s; display:inline-flex; align-items:center; gap:8px}
.filters button:hover{color:var(--text); border-color:var(--line-strong)}
.filters button[aria-pressed="true"]{background:var(--amber); border-color:var(--amber); color:#0E1114}
.filters button em{font-style:normal; font-family:var(--mono); font-size:11px; opacity:.6}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:660px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  overflow:hidden; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.2,.7,.3,1),border-color .3s}
.card:hover{transform:translateY(-4px); border-color:var(--line-strong)}
.card.hide{display:none}
.shot{aspect-ratio:16/10; background:var(--surface-2); position:relative; overflow:hidden;
  border-bottom:1px solid var(--line)}
.shot img{width:100%; height:100%; object-fit:cover}
.shot .ph{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; color:var(--muted); font-size:11.5px; font-family:var(--mono); letter-spacing:.1em;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:22px 22px}
.shot .ph svg{opacity:.35}
.lock{position:absolute; top:12px; right:12px; z-index:2; font-size:11.5px; font-weight:600;
  background:rgba(14,17,20,.86); border:1px solid var(--line-strong); color:var(--text-mid);
  padding:5px 11px; border-radius:100px; backdrop-filter:blur(6px)}
.card-body{padding:22px 22px 24px; display:flex; flex-direction:column; flex:1}
.cat{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--amber); margin-bottom:11px}
.card h3{font-size:17.5px; margin:0 0 9px; letter-spacing:-.03em; font-weight:700; line-height:1.45}
.card .desc{color:var(--text-mid); font-size:14.2px; line-height:1.78; margin:0 0 18px; flex:1}
.impact{background:var(--mint-soft); border:1px solid rgba(61,220,151,.22); border-radius:var(--r-sm);
  padding:12px 14px; margin-bottom:16px}
.impact .lb{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--mint); margin-bottom:5px}
.impact p{margin:0; font-size:13.6px; color:var(--text); line-height:1.65}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tags span{font-size:11.5px; color:var(--muted); background:rgba(255,255,255,.045);
  border:1px solid var(--line); padding:4px 10px; border-radius:6px; font-family:var(--mono)}

/* ---------- Ch.04 효과 종합 ---------- */
.impact-wrap{display:grid; grid-template-columns:1.05fr .95fr; gap:18px; align-items:start}
@media (max-width:940px){.impact-wrap{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:28px 26px}
.panel h3{font-size:16px; margin:0 0 24px; letter-spacing:-.02em; font-weight:700;
  display:flex; align-items:center; gap:9px}
.panel h3::before{content:""; width:3px; height:15px; border-radius:2px; background:var(--amber)}

.ba{margin-bottom:26px}
.ba:last-child{margin-bottom:0}
.ba .t{font-size:14.5px; font-weight:600; margin-bottom:12px; letter-spacing:-.02em}
.ba .row{display:flex; align-items:center; gap:12px; margin-bottom:7px; font-size:13px}
.ba .row .lb{width:52px; flex:none; font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--muted)}
.ba .track{flex:1; height:9px; background:rgba(255,255,255,.05); border-radius:100px; overflow:hidden}
.ba .fill{display:block; height:100%; border-radius:100px; width:0; transition:width 1.1s cubic-bezier(.2,.7,.3,1)}
.ba .before-f{background:linear-gradient(90deg,rgba(240,180,41,.55),var(--amber))}
.ba .after-f{background:linear-gradient(90deg,rgba(61,220,151,.5),var(--mint))}
.ba .v{width:84px; flex:none; text-align:right; font-family:var(--mono); font-size:12.5px; color:var(--text-mid)}
.ba .v.hi{color:var(--mint); font-weight:600}
.ba .cut{font-size:12.5px; color:var(--muted); margin-top:9px}
.ba .cut b{color:var(--mint)}

.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; margin-bottom:18px}
.kpi{background:var(--bg-soft); padding:24px 22px}
.kpi .n{font-size:clamp(25px,3.2vw,34px); font-weight:800; letter-spacing:-.04em; line-height:1.15;
  display:flex; align-items:baseline; gap:3px}
.kpi .n small{font-size:.45em; font-weight:700; color:var(--text-mid)}
.kpi.mint .n{color:var(--mint)}
.kpi.amber .n{color:var(--amber)}
.kpi .k{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.55}
.note{background:rgba(255,255,255,.025); border:1px solid var(--line); border-radius:var(--r-md); padding:20px 22px}
.note b{display:block; font-size:12px; font-family:var(--mono); letter-spacing:.12em; color:var(--muted); margin-bottom:12px}
.note ul{margin:0; padding-left:17px; color:var(--muted); font-size:12.8px; line-height:1.85}
.note li{margin-bottom:5px}

/* ---------- Ch.05 일하는 방식 ---------- */
.ways{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
@media (max-width:980px){.ways{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.ways{grid-template-columns:1fr}}
.way{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:26px 24px; position:relative}
.way .num{font-family:var(--mono); font-size:12px; color:var(--amber); letter-spacing:.16em; margin-bottom:16px}
.way h3{font-size:17px; margin:0 0 11px; letter-spacing:-.03em; font-weight:700; line-height:1.45}
.way p{color:var(--text-mid); font-size:14.2px; margin:0; line-height:1.8}

/* ---------- 기술 스택 ---------- */
.stack-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px}
.sgroup{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:24px}
.sgroup h3{font-size:13px; font-family:var(--mono); letter-spacing:.13em; color:var(--muted); margin:0 0 16px; font-weight:600}
.sgroup ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:7px}
.sgroup li{font-size:13.2px; color:var(--text-mid); background:rgba(255,255,255,.045);
  border:1px solid var(--line); padding:6px 12px; border-radius:7px}

/* ---------- 에필로그 / 연락처 ---------- */
.outro{background:linear-gradient(180deg,transparent,rgba(240,180,41,.045))}
.contact-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:clamp(28px,4.5vw,48px); box-shadow:var(--shadow)}
.contact-card h2{margin-bottom:14px}
.clist{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; margin-top:34px}
.citem{background:var(--bg-soft); padding:20px 22px}
.citem .lb{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--muted); margin-bottom:8px}
.citem .val{font-size:15px; color:var(--text); word-break:break-all}
.citem .val.empty{color:var(--muted); font-style:italic; font-size:13.5px}
.citem a{text-decoration:none; border-bottom:1px solid var(--amber-soft)}
.citem a:hover{color:var(--amber)}

footer{border-top:1px solid var(--line); padding:34px 0 46px; color:var(--muted); font-size:12.5px}
.foot{display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between}
.foot .disc{max-width:66ch; line-height:1.75}
</style>
<script>
/* ============================================================================
 *  ✍️  수정 가이드 — 이 <script> 안의 값만 고치면 페이지 전체가 바뀝니다.
 *  ----------------------------------------------------------------------------
 *  ▸ 이 파일은 index.html 하나로 끝납니다. 별도 CSS/JS 파일이 없습니다.
 *  ▸ 아래 상수만 수정하세요. 페이지 하단의 렌더링 코드는 건드릴 필요 없습니다.
 *
 *  [ 프로젝트 카드 추가하는 법 ]
 *  1) 아래 projects 배열에서 객체 하나를 통째로 복사합니다.
 *  2) 붙여넣고 값만 바꿉니다. 배열 순서 = 화면에 보이는 순서입니다.
 *  3) 저장 후 새로고침하면 카드가 자동으로 늘어납니다. (개수·필터 숫자도 자동 갱신)
 *
 *  [ projects 객체의 각 항목 설명 ]
 *   cat      : 카테고리. 'safety'(안전관리) / 'auto'(업무 자동화) / 'app'(앱·서비스)
 *              → CATEGORIES 상수에 정의된 키만 사용하세요.
 *   title    : 프로젝트 이름 (카드 제목)
 *   desc     : 무엇을 하는 시스템인지 2~3줄 설명
 *   impact   : ★핵심★ 도입 효과 한 줄. 카드 안 초록 박스에 표시됩니다.
 *              (지금 값은 초안입니다. 실제 수치로 꼭 검토·수정하세요)
 *   hours    : 연간 절감 시간(시간 단위, 전사 합계 기준 추정). 숫자만.
 *              → Ch.04 '연간 절감 시간' 합계가 이 값들의 합으로 자동 계산됩니다.
 *   est      : 외주로 만들었다면 들었을 비용(만원 단위). 숫자만.
 *              → Ch.04 '외주 환산 구축비' 합계가 이 값들의 합으로 자동 계산됩니다.

  { yr: 'STEP 01', h: '가장 자주 하던 일부터', p: '매일 반복되던 근태·인력현황 엑셀 작업을 스크립트로 옮겼습니다. 하루 한 시간이 3분이 되는 것을 확인한 순간이 시작이었습니다.' },
  { yr: 'STEP 02', h: '안전관리를 종이 밖으로', p: 'LOTO 현장안전준수필증을 앱으로 만들었습니다. 사용자앱·관리자앱·자동 발송 메일까지 한 세트로 묶어, 종이 없이 절차가 완결되게 했습니다.' },
  { yr: 'STEP 03', h: '현장 도구로 확산', p: 'TBM, 화학물질 안전카드, 설비 점검, 계측기 교정관리까지 현장에서 쓰는 도구를 차례로 앱으로 바꿨습니다. 요청이 먼저 들어오기 시작한 시점입니다.' },
  { yr: 'STEP 04', h: '사람 손을 떼다', p: '기상청 API, 뉴스 RSS, 인트라넷 게시판 폴링을 붙여 담당자가 없어도 갱신되는 구조로 만들었습니다. 무인 운영이 기본값이 됐습니다.' },
  { yr: 'STEP 05', h: '하나의 창구로', p: '흩어진 앱을 안전포털로 모으고, 해외 4개국 사이트까지 같은 양식으로 통일했습니다. 지금은 현장이 포털 하나만 기억하면 됩니다.' },
];

/* ── 7. Ch.04 Before → After 비교 막대 ─────────────────────────────────── */
/* before/after 는 같은 단위의 숫자로 넣으세요. 막대 길이는 자동 계산됩니다. */
const BARS = [
  { t: '일일 인사 근태 보고서 작성', unit: '분', before: 60,  after: 3  },

  '외주 환산 구축비: 국내 개발 외주 플랫폼의 2025~2026년 공개 단가(단순 웹 500~1,000만 원, 앱 1,000~5,000만 원, 복합 시스템 5,000만 원 이상)를 참고해 프로젝트를 소형 800만 · 중형 2,000만 · 대형 3,500만 원으로 보수적으로 분류한 뒤 합산했습니다.',

  '인력 환산: 연간 근로시간 2,000시간(1인 기준)으로 나눈 값입니다.',
  '실제 지출 0원: 회사가 이미 사용 중인 Google Workspace와 무료 호스팅 범위 안에서 구축·운영했습니다. 신규 라이선스나 구독 결제가 없습니다.',

const WAYS = [
  { n: '01', h: '현장에서 문제를 찾는다', p: '안전환경 담당으로 매일 현장과 사무를 오갑니다. 어디서 시간이 새는지, 누가 같은 일을 반복하는지 보고서보다 먼저 눈에 들어옵니다.' },
  { n: '02', h: '쓰는 사람이 직접 설계한다', p: '요구사항을 문서로 옮겨 남에게 설명하는 단계가 없습니다. 사용자가 곧 설계자라서 화면이 실제 업무 흐름 그대로 나옵니다.' },
  { n: '03', h: '있는 도구로 즉시 만든다', p: '회사가 이미 쓰는 도구 위에 올립니다. 신규 솔루션 도입 결재도, 구독료도 없이 다음 주부터 현장에서 씁니다.' },
  { n: '04', h: '운영하며 고친다', p: '전부 실제 업무에 붙어 돌아갑니다. 불편하다는 말이 나오면 그날 고치고, 다음 날 다시 쓰게 만듭니다.' },
];

/* ── 10. 기술 스택 ─────────────────────────────────────────────────────── */
const STACK = [
  { g: 'WEB / APP',        items: ['HTML', 'CSS', 'JavaScript', 'GitHub Pages', '반응형 UI', 'localStorage'] },
  { g: 'BUSINESS SYSTEM',  items: ['Google Apps Script', 'Google Sheets', 'Google Drive', '다우오피스 OpenAPI'] },
  { g: 'AUTOMATION',       items: ['Python', 'openpyxl', 'playwright', 'win32com', 'PowerShell', 'Windows 작업 스케줄러'] },
  { g: 'DATA / INTEGRATION', items: ['기상청 공공 API', 'RSS 수집', 'Gemini API', 'HTML 메일 템플릿'] },
];

/* ── 11. 연락처 ────────────────────────────────────────────────────────── */

 *    비워두면 '준비 중' 회색 문구가 나옵니다.
 *    link 에 주소를 넣으면 클릭 가능한 링크가 됩니다. (예: 'mailto:...', 'https://...')
 *    ⚠ 사내 이메일·사내 시스템 주소는 넣지 마세요. 개인 연락 수단만 사용하세요. */
const CONTACT = [
  { lb: 'EMAIL',    value: '',       link: '' },   // 예: value: 'name@example.com', link: 'mailto:name@example.com'
  { lb: 'PHONE',    value: '',       link: '' },   // 예: value: '010-0000-0000'
  { lb: 'LINKEDIN', value: '',       link: '' },   // 예: value: 'linkedin.com/in/아이디', link: 'https://...'
  { lb: 'GITHUB',   value: '',       link: '' },   // 예: value: 'github.com/아이디', link: 'https://github.com/아이디'
];
</script>

<!-- ============================================================
     아래는 화면을 그리는 코드입니다. 내용 수정은 위쪽 상수에서만 하시면 됩니다.
     ============================================================ -->
<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const nf  = n => n.toLocaleString('ko-KR');

  /* ---------- 자동 집계 (projects 배열에서 계산) ---------- */
  const inHouse    = projects.filter(p => p.internal);
  const sysCount   = inHouse.length;
  const totalHours = projects.reduce((s,p) => s + (p.hours || 0), 0);
  const totalEst   = projects.reduce((s,p) => s + (p.est   || 0), 0); // 만원 단위
  const estEok     = (totalEst / 10000).toFixed(1);                    // 억 원
  const fte        = (totalHours / 2000).toFixed(1);                   // 정규직 환산(연 2,000시간)

  /* ---------- 프롤로그 ---------- */
  $('roleLine').textContent = PROFILE.eyebrow;
  $('heroTitle').innerHTML  = PROFILE.title + '<span class="thin">' + PROFILE.titleSub + '</span>';
  $('heroSub').textContent  = PROFILE.sub;
  $('whoTags').innerHTML    = PROFILE.tags.map(t => '<span>' + esc(t) + '</span>').join('');

  const FIGURES = [
    { n: sysCount,   d: 0, u: '개',    k: '사내에서 운영 중인 시스템' },
    { n: totalHours, d: 0, u: '시간',  k: '연간 절감 업무시간 (추정)' },
    { n: +estEok,    d: 1, u: '억 원', k: '외주 구축 시 환산 비용 (추정)' },
    { n: 0,          d: 0, u: '원',    k: '실제 구축 · 운영 지출', accent: true },
  ];
  $('figures').innerHTML = FIGURES.map(f =>
    '<div class="fig' + (f.accent ? ' accent' : '') + '">' +
      '<div class="n"><span data-count="' + f.n + '" data-dec="' + f.d + '">0</span><small>' + f.u + '</small></div>' +
      '<div class="k">' + esc(f.k) + '</div>' +
    '</div>').join('');

  /* ---------- 섹션 문구 ---------- */
  const T = TEXT;
  $('p1Title').textContent = T.ch1Title; $('p1Lede').innerHTML = T.ch1Lede;
  $('p2Title').textContent = T.ch2Title; $('p2Lede').innerHTML = T.ch2Lede;
  $('p3Title').textContent = T.ch3Title; $('p3Lede').innerHTML = T.ch3Lede;
  $('p4Title').textContent = T.ch4Title; $('p4Lede').innerHTML = T.ch4Lede;
  $('p5Title').textContent = T.ch5Title; $('p5Lede').innerHTML = T.ch5Lede;
  $('p6Title').textContent = T.ch6Title; $('p6Lede').innerHTML = T.ch6Lede;
  $('p7Title').textContent = T.ch7Title; $('p7Lede').innerHTML = T.ch7Lede;
  $('disclaimer').textContent = T.disclaimer;
  $('yr').textContent = new Date().getFullYear();

  /* ---------- Ch.01 문제 ---------- */
  $('problems').innerHTML = PROBLEMS.map(p =>
    '<div class="problem reveal">' +
      '<div class="q">' + esc(p.q) + '</div>' +
      '<h3>' + esc(p.h) + '</h3>' +
      '<p>' + esc(p.p) + '</p>' +
      '<div class="before">' + esc(p.label) + '<b>' + esc(p.v) + '</b></div>' +
    '</div>').join('');

  /* ---------- Ch.02 타임라인 ---------- */
  $('timeline').innerHTML = TIMELINE.map(s =>
    '<div class="step reveal">' +
      '<div class="yr">' + esc(s.yr) + '</div>' +
      '<h3>' + esc(s.h) + '</h3>' +
      '<p>' + esc(s.p) + '</p>' +
    '</div>').join('');

  /* ---------- Ch.03 프로젝트 ---------- */
  const PLACEHOLDER =
    '<div class="ph">' +
      '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">' +
        '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l4.5-4.5 4 4L15 11l6 5.5"/><circle cx="8.5" cy="8.5" r="1.3"/>' +
      '</svg>SCREENSHOT</div>';

  $('grid').innerHTML = projects.map((p, i) =>
    '<article class="card reveal" data-cat="' + p.cat + '" style="transition-delay:' + Math.min(i % 3, 2) * 70 + 'ms">' +
      '<div class="shot">' + PLACEHOLDER +
        '<img src="' + esc(p.img) + '" alt="' + esc(p.title) + ' 화면" loading="lazy" ' +
             'onerror="this.style.display=\'none\'" style="position:absolute;inset:0">' +
        (p.internal ? '<span class="lock">🔒 사내 운영 중 (비공개)</span>' : '<span class="lock">개인 프로젝트</span>') +
      '</div>' +
      '<div class="card-body">' +
        '<div class="cat">' + esc((CATEGORIES.find(c => c.key === p.cat) || {}).label || '') + '</div>' +
        '<h3>' + esc(p.title) + '</h3>' +
        '<p class="desc">' + esc(p.desc) + '</p>' +
        (p.impact ? '<div class="impact"><div class="lb">IMPACT</div><p>' + esc(p.impact) + '</p></div>' : '') +
        '<div class="tags">' + p.stack.map(s => '<span>' + esc(s) + '</span>').join('') + '</div>' +
      '</div>' +
    '</article>').join('');

  $('filters').innerHTML = CATEGORIES.map((c, i) => {
    const n = c.key === 'all' ? projects.length : projects.filter(p => p.cat === c.key).length;
    return '<button data-f="' + c.key + '" aria-pressed="' + (i === 0) + '">' + esc(c.label) + '<em>' + n + '</em></button>';
  }).join('');

  $('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('filters').children].forEach(x => x.setAttribute('aria-pressed', x === b));
    const f = b.dataset.f;
    [...$('grid').children].forEach(card =>
      card.classList.toggle('hide', f !== 'all' && card.dataset.cat !== f));
  });

  /* ---------- Ch.04 효과 ---------- */
  $('baList').innerHTML = BARS.map(b => {
    const pct = Math.max(3, Math.round(b.after / b.before * 100));
    const cut = Math.round((1 - b.after / b.before) * 100);
    return '<div class="ba">' +
      '<div class="t">' + esc(b.t) + '</div>' +
      '<div class="row"><span class="lb">BEFORE</span><span class="track"><i class="fill before-f" data-w="100"></i></span>' +
        '<span class="v">' + nf(b.before) + b.unit + '</span></div>' +
      '<div class="row"><span class="lb">AFTER</span><span class="track"><i class="fill after-f" data-w="' + pct + '"></i></span>' +
        '<span class="v hi">' + nf(b.after) + b.unit + '</span></div>' +
      '<div class="cut">→ <b>' + cut + '% 단축</b></div>' +
    '</div>';
  }).join('');

  const KPIS = [
    { n: totalHours, d: 0, u: '시간',  k: '연간 절감 업무시간', c: 'mint'  },
    { n: +fte,       d: 1, u: '명분',  k: '정규직 인력 환산 (연 2,000시간 기준)', c: 'mint' },
    { n: +estEok,    d: 1, u: '억 원', k: '외주 환산 구축비 (16개 합계)', c: 'amber' },
    { n: 0,          d: 0, u: '원',    k: '실제 지출한 구축 · 운영 비용', c: 'amber' },
  ];
  $('kpis').innerHTML = KPIS.map(k =>
    '<div class="kpi ' + k.c + '">' +
      '<div class="n"><span data-count="' + k.n + '" data-dec="' + k.d + '">0</span><small>' + k.u + '</small></div>' +
      '<div class="k">' + esc(k.k) + '</div>' +
    '</div>').join('');

  $('notes').innerHTML = NOTES.map(n => '<li>' + esc(n) + '</li>').join('');

  /* ---------- Ch.05 일하는 방식 ---------- */
  $('ways').innerHTML = WAYS.map((w, i) =>
    '<div class="way reveal" style="transition-delay:' + i * 70 + 'ms">' +
      '<div class="num">' + esc(w.n) + '</div>' +
      '<h3>' + esc(w.h) + '</h3>' +
      '<p>' + esc(w.p) + '</p>' +
    '</div>').join('');

  /* ---------- 기술 스택 ---------- */
  $('stackGrid').innerHTML = STACK.map(g =>
    '<div class="sgroup reveal"><h3>' + esc(g.g) + '</h3><ul>' +
      g.items.map(i => '<li>' + esc(i) + '</li>').join('') +
    '</ul></div>').join('');

  /* ---------- 연락처 ---------- */
  $('contactList').innerHTML = CONTACT.map(c => {
    const v = (c.value || '').trim();
    const body = !v ? '<span class="val empty">준비 중</span>'
      : (c.link ? '<span class="val"><a href="' + esc(c.link) + '">' + esc(v) + '</a></span>'
                : '<span class="val">' + esc(v) + '</span>');
    return '<div class="citem"><div class="lb">' + esc(c.lb) + '</div>' + body + '</div>';
  }).join('');

  /* ---------- 스크롤 등장 · 숫자 카운트 · 막대 채우기 ---------- */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function countUp(el){
    const target = parseFloat(el.dataset.count), dec = +el.dataset.dec || 0;
    if (reduce || target === 0){ el.textContent = target.toFixed(dec); return; }
    const dur = 1300, t0 = performance.now();
    (function tick(now){
      const k = Math.min(1, (now - t0) / dur);
      const v = target * (1 - Math.pow(1 - k, 3));
      el.textContent = dec ? v.toFixed(dec) : nf(Math.round(v));
      if (k < 1) requestAnimationFrame(tick);
      else el.textContent = dec ? target.toFixed(dec) : nf(target);
    })(t0);
  }

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      en.target.classList.add('in');
      en.target.querySelectorAll('[data-count]').forEach(countUp);
      en.target.querySelectorAll('.fill').forEach(f => { f.style.width = f.dataset.w + '%'; });
      io.unobserve(en.target);
    });
  }, { threshold: .18, rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  /* ---------- 스크롤 진행 바 · 헤더 ---------- */
  const bar = $('progress'), head = document.querySelector('header');
  addEventListener('scroll', () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
    head.classList.toggle('stuck', scrollY > 12);
  }, { passive: true });
})();
</script>
</body>
</html>
